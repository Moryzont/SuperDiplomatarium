---
layout: default
title: Tidslinje
permalink: /tidslinje/
---

<div class="timeline-container">
  <h1 data-i18n="timeline.title">Tidslinje</h1>
  <p class="timeline-lead" data-i18n="timeline.lead">Alle daterte brev lagt ut i tid, farget etter samling. Dra over tidslinjen for å velge et tidsrom, eller klikk på et tiår; brevene i tidsrommet vises under, eldst først.</p>

  <div class="timeline-controls">
    <button type="button" id="tl-zoom-in" class="btn-secondary" data-i18n="timeline.zoomIn">Zoom inn</button>
    <button type="button" id="tl-zoom-out" class="btn-secondary" data-i18n="timeline.zoomOut">Zoom ut</button>
    <button type="button" id="tl-reset" class="btn-secondary" data-i18n="timeline.reset">Hele perioden</button>
    <span id="tl-legend" class="tl-legend"></span>
  </div>

  <div id="tl-chart" class="tl-chart" aria-label="Brev per år"></div>
  <p id="tl-status" class="tl-status" data-i18n="timeline.hint">Velg et tidsrom på tidslinjen.</p>
  <p id="tl-undated" class="tl-undated"></p>

  <div id="tl-letters" class="result-list"></div>
  <div id="tl-more"></div>
</div>

<style>
  .timeline-container { max-width: 1100px; margin: 0 auto; }
  .timeline-lead { color: #444; line-height: 1.6; max-width: 70ch; }
  .timeline-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin: .75rem 0 .25rem; }
  .tl-legend { margin-left: auto; font-size: .85rem; color: #444; }
  .tl-legend span { display: inline-block; margin-left: .6rem; }
  .tl-legend i { display: inline-block; width: .8em; height: .8em; border-radius: 2px; margin-right: .3em; vertical-align: -1px; }
  .tl-chart { position: relative; width: 100%; height: 300px; background: var(--c-light); border: 2px solid var(--c-olive); border-radius: 12px; overflow: hidden; user-select: none; }
  .tl-chart svg { display: block; width: 100%; height: 100%; }
  .tl-chart .tl-bar { cursor: pointer; }
  .tl-chart .tl-sel { fill: rgba(140, 47, 27, .18); stroke: var(--c-rust, #8c2f1b); stroke-width: 1; }
  .tl-chart .tl-axis text { font: 12px system-ui, sans-serif; fill: #444; }
  .tl-chart .tl-axis line { stroke: #b5ad9a; }
  .tl-tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--c-olive); border-radius: 6px; padding: .25rem .5rem; font-size: .85rem; color: #333; white-space: nowrap; display: none; }
  .tl-status { color: var(--c-dark); font-weight: 600; margin: .75rem 0 .25rem; }
  .tl-undated { color: #777; font-size: .85rem; margin: 0 0 .5rem; }
  #tl-more { margin: .75rem 0 2rem; }
</style>

<script>window.SITE_BASE = "{{ '' | relative_url }}";</script>
<script src="{{ '/assets/js/letter-display.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/js/browse.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/js/timeline.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
