---
layout: default
title: Utforsk brev på kart
permalink: /kart/
---

<div class="map-container">
  <h1 data-i18n="map.title">Geografisk utforskning</h1>

  <div class="map-controls">
    <button id="draw-area" class="btn-secondary" data-i18n="map.draw">Tegn område</button>
    <button id="clear-selection" class="btn-secondary" data-i18n="map.clear">Fjern valg</button>
    <span id="selection-count"></span>
  </div>

  <div id="map" style="height: 600px; width: 100%;"></div>

  <!-- Export toolbar (appears above result list) -->
  <div id="export-bar" class="export-bar" style="display:none;">
    <div class="export-left"><strong data-i18n="export.title">Eksportér utvalg:</strong></div>
    <div class="export-right">
      <button id="export-txt" class="btn-secondary" disabled data-i18n="export.downloadTxt">Last ned TXT</button>
      <button id="export-csv" class="btn-secondary" disabled data-i18n="export.downloadCsv">Last ned CSV</button>
    </div>
  </div>

  <div id="selected-letters"></div>
</div>

<!-- Page-local styles (gentle overrides) -->
<style>
  .map-container { max-width: 1100px; margin: 0 auto; }
  #selected-letters { margin-top: 1rem; }

  .export-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: .5rem; padding: .5rem .25rem; margin-top: .75rem;
    border-bottom: 2px solid var(--c-olive);
  }
  .export-bar button { margin-left: .25rem; }

  /* the list under the map uses the search page's card style */
  .letter-list { max-height: 72vh; overflow: auto; padding-right: .5rem; }
  .letter-item {
    background: var(--c-light); border: 2px solid var(--c-olive); border-radius: 12px;
    padding: 14px 16px; margin: 12px 0;
  }
  .letter-item .details { border-top: 1px solid var(--c-olive); margin-top: .5rem; padding-top: .6rem; }
  .letter-item .sammendrag, .letter-item .brevtekst, .letter-item .fotnoter, .letter-item .tillegg {
    white-space: pre-wrap; font-family: "EB Garamond", Georgia, "Times New Roman", serif; font-size: 1rem; line-height: 1.6; margin-top: .35rem;
  }
  .letter-item .section-label { display: block; font-weight: 600; color: var(--c-dark); margin-top: .5rem; }
  #selected-letters h3 { color: var(--c-dark); }
  .map-controls button { margin-right: .4rem; }
  #selection-count { float: right; color: var(--c-olive); }
</style>

<!-- Leaflet core CSS (VIKTIG hvis den ikke ligger i layouten) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<!-- Leaflet core JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

<!-- MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>

<!-- Leaflet.Draw -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js" defer></script>

<!-- baseurl for GH Pages -->
<script>window.SITE_BASE = "{{ '' | relative_url }}";</script>

<!-- Map logic -->
<script src="{{ '/assets/js/map.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
