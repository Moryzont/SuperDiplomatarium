# Build and deploy the site. One workflow, two targets:
#   push to `staging` -> https://moryzont.github.io/SuperDiplomatarium-staging/
#   push to `main`    -> https://moryzont.github.io/SuperDiplomatarium/  (production)
# Same build both ways; only the Jekyll baseurl and the deploy step differ.
# Promotion = merge staging into main. See superdiplomatarium-app/docs/PLAN.md §4.
name: Build and deploy site
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: "pages-${{ github.ref_name }}", cancel-in-progress: true }
jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'staging' }}
      url: ${{ github.ref_name == 'main' && steps.deployment.outputs.page_url || 'https://moryzont.github.io/SuperDiplomatarium-staging/' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - run: gem install jekyll --no-document
      - run: npm ci

      # The built data (three Pagefind indexes, map, detail files, vocabulary:
      # ~500 MB, 320k files, 6–7 min to build) depends only on the chunks and the
      # build script, so it is cached on those; a change to pages or scripts
      # alone skips the fetch and the build.
      - name: Restore the built data from the cache
        id: built
        uses: actions/cache@v4
        with:
          path: |
            data/v3
            data/optimized
          key: site-data-${{ hashFiles('data/chunks.manifest.json', 'scripts/build-search-v3.mjs', 'package-lock.json') }}

      - name: Fetch the letter chunks (release asset named in data/chunks.manifest.json)
        if: steps.built.outputs.cache-hit != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag=$(python3 -c "import json; print(json.load(open('data/chunks.manifest.json'))['tag'])")
          sha=$(python3 -c "import json; print(json.load(open('data/chunks.manifest.json'))['sha256'])")
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern chunks.tar.gz --output chunks.tar.gz
          echo "$sha  chunks.tar.gz" | sha256sum -c -
          rm -rf data/chunks && tar -xzf chunks.tar.gz -C data && rm chunks.tar.gz
          echo "chunks: $(ls data/chunks | wc -l) files from $tag"

      - name: Build search indexes, map data and detail store (from data/chunks)
        if: steps.built.outputs.cache-hit != 'true'
        run: node scripts/build-search-v3.mjs

      - name: Expose the letter count to Jekyll (front page reads site.data.metadata)
        run: mkdir -p _data && cp data/metadata.json _data/metadata.json

      - name: Jekyll build (production)
        if: github.ref_name == 'main'
        run: jekyll build
      - name: Jekyll build (staging)
        if: github.ref_name == 'staging'
        run: jekyll build --config _config.yaml,_config_staging.yaml

      - name: Assemble site data and check the 1 GB Pages limit
        run: |
          mkdir -p _site/data
          cp -r data/v3 _site/data/v3
          cp -r data/optimized _site/data/optimized
          cp data/metadata.json _site/data/metadata.json
          bytes=$(du -sb _site | cut -f1)
          echo "site: $(find _site -type f | wc -l) files, $((bytes / 1048576)) MB"
          test "$bytes" -lt 1000000000 || { echo "::error::site exceeds the 1 GB GitHub Pages limit"; exit 1; }

      # --- production: GitHub Pages of this repo
      - name: Upload Pages artifact
        if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - name: Deploy to production
        if: github.ref_name == 'main'
        id: deployment
        uses: actions/deploy-pages@v4

      # --- staging: push the built site to the staging repo's gh-pages branch
      - name: Deploy to staging
        if: github.ref_name == 'staging'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.STAGING_DEPLOY_KEY }}
          external_repository: Moryzont/SuperDiplomatarium-staging
          publish_branch: gh-pages
          publish_dir: ./_site
          # No force_orphan: an orphan commit re-hashes and re-uploads all 256k
          # files (11 min); an ordinary commit carries only what changed, and
          # Pagefind's files are content-hashed, so unchanged data is free.
          commit_message: "Staging deploy from SuperDiplomatarium@${{ github.sha }}"
