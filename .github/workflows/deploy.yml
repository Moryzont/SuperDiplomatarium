name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.2', bundler-cache: false }
      - run: gem install jekyll
      - run: npm ci || npm install
      - run: node scripts/build-search-v3.mjs   # v3 indexes + map + optimized from data/chunks
      - run: jekyll build
      - run: cp -r data/v3 data/optimized _site/data/ && mkdir -p _site/data && true
      - name: Assemble site data
        run: |
          mkdir -p _site/data
          cp -r data/v3 _site/data/v3
          cp -r data/optimized _site/data/optimized
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
